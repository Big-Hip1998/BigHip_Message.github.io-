<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Chat</title>
  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    
    <!-- 1. 未ログイン時：認証カード -->
    <div id="auth-card" class="card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>アカウントにログインまたは新規登録してください</p>
      </div>
      <div class="form-group">
        <label for="username">ユーザーネーム <small>(新規登録時のみ)</small></label>
        <input type="text" id="username" placeholder="例: たなか">
      </div>
      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" placeholder="6文字以上">
      </div>
      <div class="button-group">
        <button id="login-btn" class="btn btn-primary">ログイン</button>
        <button id="signup-btn" class="btn btn-secondary">新規アカウント作成</button>
      </div>
    </div>

    <!-- 2. ログイン済み時：メインチャットカード -->
    <div id="app-card" class="card hidden">
      <!-- ユーザーバー -->
      <div class="user-bar">
        <div class="user-profile">
          <div class="avatar-icon" id="user-avatar">U</div>
          <div>
            <div class="user-name" id="current-username">--</div>
            <div class="status-indicator"><span class="dot"></span> Online</div>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-outline btn-sm">ログアウト</button>
      </div>

      <!-- ルーム（合言葉）バー -->
      <div class="room-bar">
        <div class="room-input-container">
          <span class="room-icon">🔑</span>
          <input type="text" id="room-input" placeholder="部屋の合言葉" value="general">
        </div>
        <button id="join-room-btn" class="btn btn-secondary btn-sm">切替</button>
      </div>

      <!-- チャットヘッダー -->
      <div class="chat-header">
        <span class="room-tag"># <span id="current-room-name">general</span></span>
      </div>

      <!-- メッセージ表示エリア -->
      <div class="chat-body" id="message-list"></div>

      <!-- 送信フォーム -->
      <div class="chat-footer">
        <input type="text" id="message-input" placeholder="メッセージを入力...">
        <button id="send-btn" class="btn btn-primary">送信</button>
      </div>
    </div>

  </div>

  <!-- JavaScriptの読み込み -->
  <script src="script.js"></script>
</body>
</html>
